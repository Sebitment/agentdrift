name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: unit tests
        run: node --test "test/*.test.mjs"

      - name: offline demo (all tasks pass)
        run: node src/cli.ts run --adapter mock

      - name: baseline gate (unchanged run must not regress)
        run: |
          node src/cli.ts run --adapter mock --quiet --save-baseline
          node src/cli.ts run --adapter mock --quiet --baseline --fail-on-regression

      - name: html report
        if: always()
        run: node src/cli.ts run --adapter mock --tasks examples --baseline --html report.html --quiet || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentdrift-report
          path: report.html

      - name: failure paths still report the right reason
        run: |
          node src/cli.ts run --adapter mock --tasks examples --quiet --json > result.json || true
          node -e "
            const r = require('./result.json');
            const stray = r.find((t) => t.id === 'scope-creep');
            const broken = r.find((t) => t.id === 'green-but-broken');
            if (!stray || stray.pass) throw new Error('scope-creep should fail on a stray file');
            if (!stray.filesOutsideAllow.includes('package.json')) throw new Error('stray file not reported');
            if (!broken || broken.pass) throw new Error('green-but-broken should fail a check');
            if (broken.filesOutsideAllow.length !== 0) throw new Error('green-but-broken should not be a stray');
          "
